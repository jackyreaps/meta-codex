name: Build MetaCodex
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Fetch dependencies and build MetaCodex
        run: |
          lake update
          lake build MetaCodex MetaCodex.Examples.HigherDimDemo
