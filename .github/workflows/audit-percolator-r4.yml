name: Audit Percolator Round 4 (887ba02)

on:
  workflow_dispatch:

jobs:
  inspect-r4:
    runs-on: ubuntu-latest
    steps:
      - name: Clone percolator-lean (887ba02) & percolator-cli
        run: |
          git clone https://github.com/aeyakovenko/percolator-cli.git
          (cd percolator-lean && git checkout 887ba02)
          git clone --depth 1 https://github.com

      - name: Inspect recent commits & 416-byte ABI diff (9b45ad1..887ba02)
        run: |
          cd percolator-lean
          echo "=== RECENT COMMITS ==="
          git log -n 12 --oneline
          echo "=== DIFF 9b45ad1^..887ba02 ==="
          git diff 9b45ad1^..887ba02

      - name: Inspect file tree, axioms/sorry, and prior attack scripts
        run: |
          echo "=== PERCOLATOR-LEAN TREE ==="
          find percolator-lean -maxdepth 3 -not -path '*/.*'
          echo "=== AXIOMS / SORRY / UNSAFE / EXTERN ==="
          grep -rnE "axiom |sorry|unsafe|implemented_by|extern" percolator-lean/ || true
          echo "=== PRIOR BOUNTY SCRIPTS IN PERCOLATOR-CLI ==="
          ls -la percolator-cli/scripts/ || true
