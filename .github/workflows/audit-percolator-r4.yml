name: Audit Percolator Bug 4 (BTC/USD mainnet 887ba02)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bug4:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ENGINE_SHA: "1dc4466e1a6c3532f2781bc242fa4e4033751fb6"
      WRAPPER_SHA: "f626639"
      MARKET: "4EWHoCLweWAbb1DZ2sUfLRLnL9xvNJEwhnekaV7qthAp"

    steps:
      - name: Clone pinned engine, wrapper, CLI
        run: |
          set -euo pipefail
          git clone https://github.com/aeyakovenko/percolator.git
          git -C percolator checkout --detach "$ENGINE_SHA"
          git clone https://github.com/aeyakovenko/percolator-prog.git
          git -C percolator-prog checkout --detach "$WRAPPER_SHA"
          git clone https://github.com/aeyakovenko/percolator-cli.git

      - name: Dump liquidation Ok(false) path and finalization
        run: |
          set -euo pipefail
          {
            echo "=== liquidate_at_oracle_internal (full body) ==="
            grep -n "fn liquidate_at_oracle_internal" -A 200 percolator/src/percolator.rs \
              || grep -n "fn liquidate_at_oracle_internal" -A 200 percolator-prog/src/percolator.rs
            echo
            echo "=== finalize_touched_accounts_post_live ==="
            grep -n "fn finalize_touched_accounts_post_live" -A 120 percolator/src/percolator.rs \
              || grep -n "fn finalize_touched_accounts_post_live" -A 120 percolator-prog/src/percolator.rs
            echo
            echo "=== assert_public_postconditions ==="
            grep -rn "assert_public_postconditions" -A 80 percolator/src percolator-prog/src --include='*.rs' || true
          } > liquidation-atomicity.log

      - name: Dump CLI PropAMM and stale-mark close path
        run: |
          set -euo pipefail
          {
            echo "=== ROUND5-REHEARSAL.md ==="
            cat percolator-cli/ROUND5-REHEARSAL.md 2>/dev/null || echo "(missing)"
            echo
            echo "=== lean-attack.ts ==="
            cat percolator-cli/scripts/lean-attack.ts 2>/dev/null || echo "(missing)"
            echo
            echo "=== _lean-builtin-funding.ts ==="
            cat percolator-cli/scripts/_lean-builtin-funding.ts 2>/dev/null || echo "(missing)"
            echo
            echo "=== tradeWithMatcherFresh signature ==="
            grep -rn "tradeWithMatcherFresh" -A 40 percolator-cli/src --include='*.ts' || true
          } > propamm-attack-surface.log

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percolator-bug4-r4
          path: |
            liquidation-atomicity.log
            propamm-attack-surface.log
