name: Build MetaCodex
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Resolve X-files dependency and build MetaCodex
        run: |
          lake update
          lake exe cache get || true
          lake build MetaCodex Examples.HigherDimDemo
