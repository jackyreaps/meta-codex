name: Build MetaCodex
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and Lean toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Resolve dependencies and build MetaCodex
        run: |
          lake update
          lake build MetaCodex MetaCodex.Examples.HigherDimDemo
