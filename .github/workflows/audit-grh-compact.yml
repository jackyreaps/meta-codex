name: Audit grh-compact (Lean 4.35.0)
on:
  workflow_dispatch:

jobs:
  audit-grh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout meta-codex
        uses: actions/checkout@v4
        with:
          path: meta-codex

      - name: Install Elan & Lean 4.35.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.35.0
          elan default leanprover/lean4:v4.35.0
          lean --version

      - name: Clone + unpack grh-compact
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth 1 https://github.com/1337isnot1337/riemann-hypothesis-minimal.git rh-min
          lean --run rh-min/OneLineRH.lean grh-compact
          test -d grh-compact/src
          ls grh-compact | head

      - name: Inspect Main, Statements, New, grh chain (no Mathlib build)
        run: |
          cd grh-compact
          echo "=== src/Main.lean ==="
          cat src/Main.lean
          echo "=== src/Statements.lean ==="
          cat src/Statements.lean 2>/dev/null || echo "(no Statements.lean)"
          echo "=== src/New/Main.lean ==="
          cat src/New/Main.lean 2>/dev/null || echo "(no New/Main.lean)"
          echo "=== Find grh / zeta_zeros_on_line / zeros_on_line ==="
          grep -rnE "theorem[[:space:]]+(grh|zeta_zeros_on_line|zeros_on_line)|def[[:space:]]+(grh|zeta_zeros_on_line|zeros_on_line)|lemma[[:space:]]+(grh|zeta_zeros_on_line|zeros_on_line)" src 2>/dev/null | head -n 80
          echo "=== Files in src/New ==="
          find src/New -type f 2>/dev/null | sort
          echo "=== Structures / inductives in src/New ==="
          grep -rnE "^structure[[:space:]]+|^inductive[[:space:]]+" src/New 2>/dev/null | head -n 80
          echo "=== divClausesR_of / anyGeometry / GeoP / GeoCl in src ==="
          grep -rnE "divClausesR_of|anyGeometry|GeoP|GeoCl" src 2>/dev/null | head -n 40 || echo "(none)"
          echo "=== Opaque / Axiom / Sorry in src/ ==="
          grep -rnE "^[[:space:]]*(opaque|axiom|sorry)\b" src 2>/dev/null || echo "None in src/"

      - name: Optional Mathlib cache only
        continue-on-error: true
        timeout-minutes: 8
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd grh-compact
          lake exe cache get || true
