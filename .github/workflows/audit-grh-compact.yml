name: Audit grh-compact (Lean 4.35.0)
on:
  workflow_dispatch:

jobs:
  audit-grh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout meta-codex
        uses: actions/checkout@v4
        with:
          path: meta-codex

      - name: Install Elan & Lean 4.35.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.35.0
          elan default leanprover/lean4:v4.35.0

      - name: Clone + unpack grh-compact
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth 1 https://github.com/1337isnot1337/riemann-hypothesis-minimal.git rh-min
          lean --run rh-min/OneLineRH.lean grh-compact
          test -d grh-compact/src

      - name: Extract Main, Statements, New.* (no Mathlib build)
        run: |
          cd grh-compact
          echo "=== src/Main.lean ==="
          cat src/Main.lean
          echo "=== src/Statements.lean ==="
          cat src/Statements.lean 2>/dev/null || echo "(no Statements.lean)"
          echo "=== Files under src/New ==="
          find src/New -type f 2>/dev/null | sort || find src -iname '*grh*' -o -iname '*zeta*' | sort
          echo "=== grh / zeta_zeros_on_line defs ==="
          grep -rnE "theorem[[:space:]]+(grh|zeta_zeros_on_line)|def[[:space:]]+(grh|zeta_zeros_on_line)|structure[[:space:]]+" src 2>/dev/null | head -n 80
          echo "=== Opaque / Axiom / Sorry in src/ ==="
          grep -rnE "^[[:space:]]*(opaque|axiom|sorry)\b" src 2>/dev/null || echo "None in src/"

      - name: Optional cache only (no full Mathlib compile)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd grh-compact
          lake exe cache get || true
