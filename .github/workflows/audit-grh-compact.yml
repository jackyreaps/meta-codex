name: Audit grh-compact (Lean 4.35.0)
on:
  workflow_dispatch:

jobs:
  audit-grh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout meta-codex
        uses: actions/checkout@v4
        with:
          path: meta-codex

      - name: Install Lean 4.35.0
        uses: leanprover/lean-action@v1
        with:
          toolchain: leanprover/lean4:v4.35.0
          build: false

      - name: Clone + unpack grh-compact
        run: |
          git clone --depth 1 https://github.com/1337isnot1337/riemann-hypothesis-minimal.git  rh-min
          lean --run rh-min/OneLineRH.lean grh-compact

      - name: Inspect exists_few_translates and span_short_ramifiedColumns
        run: |
          cd grh-compact
          grep -rn -B 2 -A 25 "exists_few_translates" src/New/ || true
          grep -rn -B 2 -A 25 "span_short_ramifiedColumns" src/New/ || true
