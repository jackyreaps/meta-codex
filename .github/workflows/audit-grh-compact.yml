name: Audit grh-compact (Lean 4.35.0)
on:
  workflow_dispatch:

jobs:
  audit-grh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout meta-codex
        uses: actions/checkout@v4
        with:
          path: meta-codex

      - name: Install Elan & Lean 4.35.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.35.0
          elan default leanprover/lean4:v4.35.0

      - name: Clone + unpack grh-compact
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth 1 https://github.com/1337isnot1337/riemann-hypothesis-minimal.git rh-min
          lean --run rh-min/OneLineRH.lean grh-compact
          test -d grh-compact/src

      - name: Inspect Data + exists_family_covolumeSq_le (no Mathlib build)
        run: |
          cd grh-compact
          echo "=== Files in src/New/Data ==="
          find src/New/Data -type f 2>/dev/null | sort
          echo "=== structure Data / class Data (heads) ==="
          grep -rnE "^structure[[:space:]]+Data|^class[[:space:]]+Data|^def[[:space:]]+Data\b" src/New 2>/dev/null | head -n 40
          echo "=== Data structure body (first match file, limited) ==="
          f=$(grep -rlE "^structure[[:space:]]+Data|^class[[:space:]]+Data" src/New/Data 2>/dev/null | head -n 1)
          if [ -n "$f" ]; then
            echo "FILE: $f"
            # print from structure/class Data through ~80 lines
            awk '/^structure Data|^class Data/{flag=1} flag{print; n++; if(n>100) exit}' "$f"
          else
            echo "(no structure Data found under Data/)"
            grep -rnE "structure Data|class Data" src/New 2>/dev/null | head -n 20
          fi
          echo "=== exists_data ==="
          grep -rnE "theorem[[:space:]]+exists_data|lemma[[:space:]]+exists_data|def[[:space:]]+exists_data" src/New 2>/dev/null | head -n 20
          grep -rn -A 30 "exists_data" src/New/Data 2>/dev/null | head -n 80
          echo "=== exists_family_covolumeSq_le statement ==="
          grep -rn -A 40 "exists_family_covolumeSq_le" src/New/Endgame 2>/dev/null | head -n 120
          echo "=== Opaque / Axiom / Sorry in src/New/Data and Endgame ==="
          grep -rnE "^[[:space:]]*(opaque|axiom|sorry)\b" src/New/Data src/New/Endgame 2>/dev/null || echo "None"

      - name: Optional cache only
        continue-on-error: true
        timeout-minutes: 8
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd grh-compact
          lake exe cache get || true
