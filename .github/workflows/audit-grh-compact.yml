name: Audit grh-compact (Lean 4.35.0)
on:
  workflow_dispatch:

jobs:
  audit-grh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout meta-codex
        uses: actions/checkout@v4
        with:
          path: meta-codex

      - name: Install Elan & Lean 4.35.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.35.0
          elan default leanprover/lean4:v4.35.0
          lean --version

      - name: Clone riemann-hypothesis-minimal
        run: |
          git clone --depth 1 https://github.com/1337isnot1337/riemann-hypothesis-minimal.git rh-min

      - name: Unpack / prepare grh-compact (if OneLineRH exists)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          if [ -f rh-min/OneLineRH.lean ]; then
            lean --run rh-min/OneLineRH.lean grh-compact || true
          fi
          # Fall back: treat the clone itself as the project
          if [ ! -d grh-compact ]; then
            mv rh-min grh-compact
          fi
          ls -la grh-compact | head

      - name: Inspect toolchain, headline RH, opaque/axiom/sorry, divClausesR_of
        run: |
          cd grh-compact
          echo "=== lean-toolchain ==="
          cat lean-toolchain 2>/dev/null || echo "(none)"
          echo "=== lakefile ==="
          cat lakefile.toml 2>/dev/null || cat lakefile.lean 2>/dev/null || echo "(none)"
          echo "=== Headline RiemannHypothesis / zeta ==="
          grep -rnE "theorem[[:space:]]+.*RiemannHypothesis|def[[:space:]]+RiemannHypothesis|def[[:space:]]+riemannZeta" . 2>/dev/null | head -n 40 || true
          echo "=== Opaque / Axiom / Sorry ==="
          grep -rnE "^[[:space:]]*(opaque|axiom|sorry)\b" . 2>/dev/null | head -n 50 || true
          echo "=== divClausesR_of ==="
          grep -rn "divClausesR_of" . 2>/dev/null | head -n 25 || true

      - name: Wire meta-codex and build
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd grh-compact
          # Add path dependency if lakefile.toml exists
          if [ -f lakefile.toml ]; then
            cat << 'EOF' >> lakefile.toml

          [[require]]
          name = "meta-codex"
          path = "../meta-codex"
          EOF
          fi
          lake exe cache get || true
          lake update || true
          lake build || lake build RiemannHypothesis || lake build meta-codex
