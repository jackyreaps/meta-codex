name: Audit grh-compact (Lean 4.35.0)
on:
  workflow_dispatch:

jobs:
  audit-grh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout meta-codex
        uses: actions/checkout@v4
        with:
          path: meta-codex

      - name: Install Elan & Lean 4.35.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.35.0
          elan default leanprover/lean4:v4.35.0

      - name: Clone + unpack grh-compact
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth 1 https://github.com/1337isnot1337/riemann-hypothesis-minimal.git rh-min
          lean --run rh-min/OneLineRH.lean grh-compact
          test -d grh-compact/src

      - name: Inspect short_forms and enough_forms
        run: |
          cd grh-compact
          echo "=== File head ==="
          wc -l src/New/Endgame/ShortAndEnough.lean
          echo "=== Declarations of short_forms / enough_forms ==="
          grep -nE "theorem[[:space:]]+(short_forms|enough_forms)|lemma[[:space:]]+(short_forms|enough_forms)|def[[:space:]]+(short_forms|enough_forms)" src/New/Endgame/ShortAndEnough.lean
          echo "=== short_forms context ==="
          grep -n -B 5 -A 50 "short_forms" src/New/Endgame/ShortAndEnough.lean | head -n 200
          echo "=== enough_forms context ==="
          grep -n -B 5 -A 50 "enough_forms" src/New/Endgame/ShortAndEnough.lean | head -n 200
          echo "=== heightPerRow_le / remainder_eq if present ==="
          grep -nE "heightPerRow_le|remainder_eq|abs_mainHeight_add_remainder_le" src/New/Endgame/ShortAndEnough.lean | head -n 40
          echo "=== Opaque / Axiom / Sorry in ShortAndEnough ==="
          grep -nE "^[[:space:]]*(opaque|axiom|sorry)\b" src/New/Endgame/ShortAndEnough.lean || echo "None"
